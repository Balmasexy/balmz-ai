name: BALMZ AI Android APK and AAB

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/super-admin-workplace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balmz-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build branded Android application
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Check out BALMZ AI
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android SDK manager
        id: android-sdk
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDKMANAGER" --licenses >/dev/null

      - name: Install Android API 36 and build tools
        run: "$ANDROID_SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install BALMZ AI dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx cap add android

      - name: Generate BALMZ logo launcher and splash assets
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor "#080D15"
          --iconBackgroundColorDark "#080D15"
          --splashBackgroundColor "#080D15"
          --splashBackgroundColorDark "#080D15"

      - name: Sync Capacitor Android plugins and web configuration
        run: npx cap sync android

      - name: Build APK and Android App Bundles
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleDebug assembleRelease bundleRelease

      - name: Sign Play Store release outputs when upload-key secrets are configured
        if: ${{ env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && env.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && env.ANDROID_UPLOAD_KEY_ALIAS != '' && env.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/balmz-ai-upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/balmz-ai-upload.jks" \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_UPLOAD_KEY_PASSWORD" \
            -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_UPLOAD_KEY_ALIAS"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/balmz-ai-upload.jks" \
            --ks-key-alias "$ANDROID_UPLOAD_KEY_ALIAS" \
            --ks-pass env:ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_UPLOAD_KEY_PASSWORD \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release-signed.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release-signed.apk

      - name: Prepare Android build artifacts
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/BALMZ-AI-debug.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab dist/android/BALMZ-AI-debug.aab
          cp android/app/build/outputs/bundle/release/app-release.aab dist/android/BALMZ-AI-release-unsigned.aab
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/android/BALMZ-AI-release-unsigned.apk
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release-signed.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release-signed.aab dist/android/BALMZ-AI-release-signed.aab
            cp android/app/build/outputs/apk/release/app-release-signed.apk dist/android/BALMZ-AI-release-signed.apk
          fi
          {
            echo "BALMZ AI Android build"
            echo "Application ID: com.balmz.ai"
            echo "Application URL: https://balmz-ai.onrender.com"
            echo
            echo "The debug APK is signed with the Android debug key and is suitable for device testing."
            echo "The debug AAB is also debug-signed and is not a Play Store upload."
            if [ -f dist/android/BALMZ-AI-release-signed.aab ]; then
              echo "The release AAB/APK are signed with the configured BALMZ AI upload key."
            else
              echo "The release AAB/APK are unsigned because Android upload-key secrets are not configured."
              echo "Configure ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD in GitHub Actions secrets to create Play Store upload-ready release outputs."
            fi
          } > dist/android/BUILD-INFO.txt

      - name: Upload Android APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BALMZ-AI-Android-${{ github.run_number }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
