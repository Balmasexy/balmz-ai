name: BALMZ AI Linux Build

on:
  push:
    branches:
      - chore/linux-build-check
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: balmz-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with standard Next.js compiler
        run: pnpm exec next build
